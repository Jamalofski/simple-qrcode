name: Tests

# Manual only: run the full matrix before a release. To check a fix, run a subset,
# for example php ["8.4"] and laravel ["13"].
on:
  workflow_dispatch:
    inputs:
      php:
        description: PHP versions, as a JSON list
        default: '["8.2", "8.3", "8.4", "8.5"]'
      laravel:
        description: Laravel versions, as a JSON list
        default: '["11", "12", "13"]'

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php) }}
        laravel: ${{ fromJSON(inputs.laravel) }}
        exclude:
          - php: '8.2'
            laravel: '13'
          - php: '8.5'
            laravel: '11'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      # Testbench 9, 10 and 11 run Laravel 11, 12 and 13.
      # Laravel 11 is out of security support: Composer blocks it unless told otherwise.
      - name: Install dependencies
        run: >
          composer update --prefer-dist --no-interaction --no-progress -W
          --with "orchestra/testbench:${{ matrix.laravel == '11' && '^9.0' || matrix.laravel == '12' && '^10.0' || '^11.0' }}"
          ${{ matrix.laravel == '11' && '--no-security-blocking' || '' }}

      - name: Run test suite
        run: composer test
